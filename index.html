<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My eCommerce Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #007bff; color: white; padding: 1rem; text-align: center; }
        nav a { color: white; margin: 0 10px; text-decoration: none; }
        .products { display: flex; flex-wrap: wrap; justify-content: center; margin: 20px; }
        .product { border: 1px solid #ddd; border-radius: 5px; margin: 10px; padding: 10px; width: 200px; text-align: center; }
        .product img { max-width: 100%; }
        footer { text-align: center; padding: 1rem; background: #f1f1f1; margin-top: 20px; }
        .btn { display: inline-block; padding: 8px 12px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>My eCommerce Store</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="form.html">Buy Now</a>
    </nav>
</header>

<section class="products">
    <div class="product">
        <img src="https://via.placeholder.com/150" alt="Product 1">
        <h3>Product 1</h3>
        <p>₹499</p>
        <a class="btn" href="form.html">Buy Now</a>
    </div>
    <div class="product">
        <img src="https://via.placeholder.com/150" alt="Product 2">
        <h3>Product 2</h3>
        <p>₹699</p>
        <a class="btn" href="form.html">Buy Now</a>
    </div>
    <div class="product">
        <img src="https://via.placeholder.com/150" alt="Product 3">
        <h3>Product 3</h3>
        <p>₹299</p>
        <a class="btn" href="form.html">Buy Now</a>
    </div>
</section>

<footer>
    &copy; 2026 My eCommerce Store
</footer>

</body>
</html>
